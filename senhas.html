<div class="container">

<div class="info-card">

<h2>🔐 Gerador de Senha</h2>

<input type="text" id="nome" placeholder="Nome do Pet">

<input type="text" id="cor" placeholder="Cor Favorita">

<input type="number" id="ano" placeholder="Ano Importante">

<button onclick="gerarSenha()">
Gerar Senha
</button>

<p class="resultado" id="senhaGerada"></p>

</div>

<div class="info-card">

<h2>📊 Teste sua Senha</h2>

<input
type="text"
id="senhaUsuario"
placeholder="Digite sua senha"
onkeyup="avaliarSenha()">

<p class="resultado" id="forcaSenha"></p>

</div>
